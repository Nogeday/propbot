# Risk defaults — change only with a written reason in docs/adr/.
# Hard caps below are ALSO enforced in code; editing this file cannot exceed them.
risk_per_trade_pct: 0.25                 # code hard max: 0.5
daily_cap_pct: 1.0                       # code enforces <= 0.5 * venue.daily_loss_limit_pct
weekly_cap_pct: 3.0                      # pause all strategies until manual /devam
flatten_when_daily_buffer_below_pct: 40  # flatten everything when remaining daily buffer < 40 %
max_consecutive_losses: 5                # per strategy -> pause next trading day + report
max_positions_total: 2
max_positions_per_strategy: 1
self_request_budget_per_day: 300         # per account; firm threshold lives in the venue profile
trail_min_step_ticks: 4
signal_validity_seconds: 60
signal_max_drift_frac_of_stop: 0.25      # skip if price moved > 25 % of stop distance before execution
