# TradingView alert line: webhook rules, receiver limits, heartbeat watch and alert expiry dates.
#
# The `webhook` values were supplied by the user from TradingView's official "About webhooks"
# help page on 2026-11-13. SPEC §1: re-check them against that page on EVERY deployment — copy the
# source IP list from the page itself, not from this file or any other document — then update
# `rules_verified_at`. deploy/Caddyfile and the firewall rules in docs/runbook.md must list the
# same addresses (tests compare the three).
#
# Limits marked "code hard max/min" are ALSO enforced in code (src/propbot/signals/tvconfig.py);
# a value beyond them is a load error, never silently clamped. Every key is required.

# What TradingView publishes about webhook delivery.
webhook:
  rules_verified_at: 2026-11-13            # YYYY-MM-DD: when the values below were last compared with the page
  source_ips:                              # only these addresses may reach POST /tv/webhook (IPv4, public)
    - "52.89.214.238"
    - "34.212.75.30"
    - "54.218.53.128"
    - "52.32.178.7"
  allowed_ports: [80, 443]                 # informational (deployment check): TradingView delivers only to these
  response_timeout_seconds: 3              # TradingView cancels a request that is not answered within this time
  mtls_supported: false                    # must stay false: no client certificate -> security = source IP + body token

# Our own receiver (bound to loopback behind a local TLS proxy).
receiver:
  trusted_proxies: ["127.0.0.1", "::1"]    # peers allowed to supply the client-IP header; loopback/private, <= 256 addresses each
  client_ip_header: "X-Forwarded-For"      # the only supported value: every supported proxy writes it; right-most entry = client
  rate_limit_per_minute: 30                # code hard max: 30 (SPEC §5.3)
  max_body_bytes: 4096                     # code hard max: 4096, min: 1024 (SPEC §5.2); keep in step with deploy/Caddyfile

# Alarm when no alert of any kind (heartbeat included) arrives for too long inside a watch window.
heartbeat:
  max_silence_minutes: 75                  # code hard max: 75 (SPEC §5.5); the heartbeat indicator alerts once an hour
  watch_windows:                           # America/New_York wall time; start < end; times as quoted "HH:MM"
    - {days: [mon, tue, wed, thu, fri], start: "03:00", end: "16:00"}

# One entry per TradingView alert you created, with the day it expires (null = no expiry on your plan).
# Names must be unique. Example:
#   alerts:
#     - {name: "heartbeat MES1! 1m", expires_on: 2027-01-12}
#     - {name: "ny_orb_fvg MES1! 1m", expires_on: null}
alerts: []
expiry_reminder_days: 7                    # remind this many days before an alert expires; code hard max: 30
